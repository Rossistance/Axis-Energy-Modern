# Security headers (audit M2, 2026-11-20). The same six headers are in every file in hosting/;
# tests/security-headers.spec.ts loads every page under this policy and checks the files agree.
# connect-src and form-action allow any https: origin so the form service works whichever one
# is chosen; narrow them to its origin once it is known.
# Include inside the server {} block. A location block with its own add_header drops these,
# so include this file there too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; form-action 'self' https: mailto:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
