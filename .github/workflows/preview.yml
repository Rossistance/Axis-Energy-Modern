# Temporary preview of the josh-requests-2026-11-20 branch (Ross, 2026-11-20).
#
# GitHub Pages deploys from GitHub Actions. "Build and deploy" (deploy.yml) is disabled so its
# 6-hourly rebuild of Main-Backup cannot overwrite this preview; this workflow builds, tests and
# deploys the branch on every push to it instead. When the branch is merged into Main-Backup:
# delete this file, re-enable "Build and deploy", and remove the branch from the github-pages
# environment's deployment branches.
name: Preview branch

on:
  push:
    branches: [josh-requests-2026-11-20]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Same settings as the build job in deploy.yml.
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://rossistance.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/Axis-Energy-Modern' }}
      PUBLIC_SITE_MODE: ${{ vars.PUBLIC_SITE_MODE || 'preview' }}
      PUBLIC_FORM_ENDPOINT_CONTACT: ${{ vars.PUBLIC_FORM_ENDPOINT_CONTACT }}
      PUBLIC_FORM_ENDPOINT_RFQ: ${{ vars.PUBLIC_FORM_ENDPOINT_RFQ }}
      PUBLIC_FORM_ENDPOINT_SUBS: ${{ vars.PUBLIC_FORM_ENDPOINT_SUBS }}
      JOBS_SOURCE: ${{ vars.JOBS_SOURCE || 'static' }}
      JOBS_BOARD: ${{ vars.JOBS_BOARD }}
      JOBS_URL: ${{ vars.JOBS_URL }}
      PUBLIC_JOBS_LINKEDIN_URL: ${{ vars.PUBLIC_JOBS_LINKEDIN_URL }}
      PUBLIC_JOBS_INDEED_URL: ${{ vars.PUBLIC_JOBS_INDEED_URL }}
      NEWS_SOURCE: ${{ vars.NEWS_SOURCE || 'static' }}
      NEWS_URL: ${{ vars.NEWS_URL }}
      NEWS_LIMIT: ${{ vars.NEWS_LIMIT }}
      LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
      LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
      LINKEDIN_INCLUDE_RESHARES: ${{ vars.LINKEDIN_INCLUDE_RESHARES }}
      LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: npm@latest

  # Same checks as deploy.yml: the HTML validator and the Playwright suite gate the deploy.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run validate:html
      - run: npm test

  deploy:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
